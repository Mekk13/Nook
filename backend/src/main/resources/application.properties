spring.application.name=backend
spring.profiles.active=v2

server.address=0.0.0.0

# ---------- Local secrets override (gitignored) ----------
# In dev: backend/application-local.properties supplies real values.
# In prod: this file is absent and values come from real environment variables
# set in the cloud platform (Render / Vercel / etc).
spring.config.import=optional:file:application-local.properties

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---------- GraphQL ----------
# graphiql is the public-facing GraphQL playground UI.
# Locally: set GRAPHIQL_ENABLED=true in application-local.properties.
# In prod: leave unset → it's off → schema not browseable by strangers.
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:false}

# ---------- Postgres ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- MongoDB ----------
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/nook-chat}

# ---------- TLS / Keystore ----------
# In production: NO SSL config here. The cloud platform (Render / Railway / etc)
# terminates TLS with Let's Encrypt and forwards plain HTTP to us.
# In dev: server.ssl.* + server.port=8443 are set in application-local.properties.
server.port=${PORT:8080}

# ---------- Mail (Mailtrap / SMTP) ----------
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Frontend URL (used for OAuth redirect + CORS) ----------
app.frontend.url=${FRONTEND_URL:https://localhost:5173}
app.cors.allowed-origins=${FRONTEND_URL:https://localhost:5173}

# ---------- OAuth ----------
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET}
oauth.github.client-id=${GITHUB_CLIENT_ID}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET}
